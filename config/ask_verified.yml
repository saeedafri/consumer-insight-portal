# Ask Coresight's verified questions: common analyst questions with the answer an analyst checked, read by
# api/ask_index.py load_verified. A question asked with the same meaning (vectors ≥ 0.9) and the same names and groups
# uses this plan with no model call (Snowflake's "verified queries", research 11 Nov 2026).
# Admins add more from the Ask page ("Save as verified"); those go to logs/ask-verified.json until reviewed into here.
# Worded differently from scripts/ask_golden.yml on purpose: a golden question answered from here would test nothing.
#
#   question  the wording   code/family  the survey question   focus  answers to lead with
#   kind      share | count | top | trend | compare            cut    none | generation | gender | income_band | region …
#   period    latest | all | previous | first_vs_latest
