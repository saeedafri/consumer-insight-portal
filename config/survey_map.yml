# ══════════════════════════════════════════════════════════════════════════
# Survey mapping rules — how CSI makes sense of a questionnaire it has never
# seen before.
#
# Nothing here is required. If a new wave adds a module, renames a question or
# drops one, the loader still works: unmatched questions land in the
# UNCLASSIFIED topic and unmatched demographics simply don't appear as filters.
# These rules only make the portal tidier.
#
# Rules are matched in `priority` order (low first), first match wins.
# `pattern` is a Python regex tested against the question code;
# `text_pattern` is tested against the question wording (case-insensitive).
# `family: "*"` applies to every survey.
# ══════════════════════════════════════════════════════════════════════════

# ── Which waves are one study ───────────────────────────────────────────────
# A study's family normally comes from its title with the year dropped (etl/forsta_etl.family,
# etl/legacy_dwh.study_for), so a study retitled from one year to the next ("Holiday 2021 Shopping and
# Spending", "Holiday Shopping and Spending 2025", "Holiday Shopping 2026") loses its year-on-year comparison.
# Listed here by source reference (Forsta path, Qualtrics SV_ id, SurveyMonkey id), the waves share one family
# and each compares with the one a year before (etl/serving.YEAR_DAYS). Applied at load; for waves already
# loaded see docs/REA Claude Opus 2026-10-23/80-fixes-etl.md (runbook).
family:
  HOLIDAY_SHOPPING:             # annual
    - "311513587"               # survey_id 361 · Holiday 2021 Shopping and Spending (SurveyMonkey)
    - SV_5iEwVt7DCv68iMK        # 126 · Holiday 2023 Shopping and Spending (Qualtrics)
    - selfserve/58f/holiday     # 239 · Holiday Shopping and Spending 2025
    - selfserve/58f/260905      # 262 · Holiday Shopping 2026
  ONLINE_GROCERY:               # annual
    - "131312996"               # 210 · Online Grocery 2019
    - SV_eLIemMjZOqoobj0        # 99  · Online Grocery 2023
    - SV_b2b9j6XNAtY0F4G        # 157 · Online Grocery 2024
    - SV_6uot1ZQiKKsjdqe        # 196 · Online Grocery 2025
    - selfserve/58f/260503      # 511 · Online Grocery 2026
  APPAREL_SHOPPING:             # annual (Amazon Apparel Annual Tracker 2026, 494, is left out: confirm it is this study)
    - "165769350"               # 209 · Apparel and General Shopping Survey 2019
    - "277793435"               # 214 · Apparel and General Shopping Survey, Feb 2020
    - "302343805"               # 327 · Apparel Shopping Survey, Mar 2021
    - "318304837"               # 386 · Apparel Shopping Survey, Feb 2022
    - SV_0eweRRhLaBQ1kq2        # 90  · Annual Apparel Shopping 2023
  BACK_TO_SCHOOL:               # ad hoc (under 1,500 completes each year)
    - "309290717"               # 349 · US Back-to-School Survey 2021
    - "506778513"               # 406 · Back-to-School Survey 2022
    - SV_8GuBh4A7c34vOBw        # 106 · Back to School 2023
    - selfserve/58f/bts25       # 509 · Back-to-school 2026
  SHOPPING_AND_SOCIAL_MEDIA:    # annual
    - "272687358"               # 213 · Shopping and social media 2019
    - "302456615"               # 329 · Shopping and social media 2021

topics:
  # ── CSI-US, the Consumer Sentiment & Shopping Insights wave ─────────────
  - {family: "CSI-US", priority: 10, pattern: "^q[1-6]$",                       topic: SHOPPING}
  - {family: "CSI-US", priority: 20, pattern: "^DP\\d",                         topic: DEPT_STORES}
  - {family: "CSI-US", priority: 30, pattern: "^DJ\\d",                         topic: DIAMONDS}
  - {family: "CSI-US", priority: 40, pattern: "^BN\\d",                         topic: BNPL}
  - {family: "CSI-US", priority: 50, pattern: "^D(28|29|30|31|32|33|34|35)(?!\\d)", topic: AI_GENAI}
  - {family: "CSI-US", priority: 60, pattern: "^GP\\d",                         topic: GLP1}
  - {family: "CSI-US", priority: 70, pattern: "^CS\\d",                         topic: SENTIMENT}
  - {family: "CSI-US", priority: 80, pattern: "^D(12|13|14|15)$",               topic: MACRO}
  - {family: "CSI-US", priority: 90, pattern: "^D[1-8]$",                       topic: DEMOGRAPHICS}
  # rotating modules added in the 09/28/26 wave
  - {family: "CSI-US", priority: 100, pattern: "^XM\\d",                        topic: HOLIDAY_SHOPPING}
  - {family: "CSI-US", priority: 110, pattern: "^HX\\d",                        topic: HOLIDAY_OUTLOOK}
  - {family: "CSI-US", priority: 120, pattern: "^BT\\d",                        topic: BEAUTY}
  - {family: "CSI-US", priority: 130, pattern: "^TF\\d",                        topic: TARIFFS}
  - {family: "CSI-US", priority: 140, pattern: "^IN\\d",                        topic: INFLATION}

  # ── Applies to every survey: technical/paradata variables ───────────────
  - {family: "*", priority: 900, pattern: "^(record|uuid|date|markers|status|source|session|url|list|decLang|userAgent|dcua|RID|start_date|conditions)$", topic: TECHNICAL}
  - {family: "*", priority: 910, pattern: "^(qtime|vlist|vos|vbrowser|vmobile|vdropout|vterm|vq|voq)",   topic: TECHNICAL}

  # ── Last-resort classification by wording, for a module we've never seen ─
  - {family: "*", priority: 950, text_pattern: "\\b(gender|age|income|ethnicit|marital|relationship status|state|region|zip)\\b", topic: DEMOGRAPHICS}

# Which question supplies each demographic cut. Auto-detected from the question
# wording when a survey has no entry here, then written to cip_profile_map so
# it is visible and editable per wave.
profile:
  CSI-US:
    gender:          D1
    age:             D2
    relationship:    D3
    ethnicity:       D4
    income_band:     D5
    urbanicity:      D6
    political:       D7
    state_name:      D8
    outlook_income:  CS1
    outlook_economy: CS2

# Wording used to auto-detect a demographic when no explicit mapping exists.
# First matching question code wins.
profile_detect:
  gender:          "what is your gender"
  age:             "what is your age"
  relationship:    "relationship status|marital status"
  ethnicity:       "ethnicity|racial|race do you"
  # the demographic phrasing only: "…to your monthly household income" (a
  # debt-ratio question in Dec 2022) must not win over the real question
  income_band:     "your total (annual )?household income|total income"
  urbanicity:      "area where your primary residence|area where you live"
  political:       "political philosophy|political party"
  # not "which state" alone: "Which statement…", "Which state did you move from?"
  state_name:      "which state (is your primary residence|do you (currently )?(live|reside))|state is your primary residence"
  outlook_income:  "discretionary income"
  outlook_economy: "economy overall"

# Derived bands. Edit here rather than in code.
age_bands:
  - {label: "18-29",   min: 18, max: 29}
  - {label: "30-44",   min: 30, max: 44}
  - {label: "45-60",   min: 45, max: 60}
  - {label: "Over 60", min: 61, max: 200}

generations:
  - {label: "GenZ",       min: 18, max: 28}
  - {label: "Millennial", min: 29, max: 44}
  - {label: "GenX",       min: 45, max: 60}
  - {label: "Boomer",     min: 61, max: 200}

# US Census regions. The export gives two-letter codes ('CT', 'NC'), but a
# different wave or country may give full names, so both are listed and the
# lookup is case-insensitive.
