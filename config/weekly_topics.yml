# The weekly topic screens (frontend/src/screens/Weekly.tsx; the manager's roadmap of 27 Nov 2026): Activities &
# retailers (/app/activities), Spending pressure (/app/spending), Consumer sentiment & outlook (/app/sentiment).
# etl/weekly_topics.py reads this at every publish and writes api/v1/weekly/<topic>.json.gz from the US weekly tracker's
# published question files; the screen only draws what it is given. A topic's key is its address and its menu
# (config/access.yml features).
#
# Each tab is one question:
#   codes     the question files holding it (newest code first): the tracker renumbered its questions, and an older
#             code may hold it in older weeks (activities were Q3 from Aug 2022 to Dec 2023)
#   wording   a regular expression on the question's wording: only weeks asked with it count, because a code also held
#             other questions in other weeks (Q6 held food retailers until Jun 2026, expenses from Jul 2026)
#   answers   one of: every answer given (a multiple-answer question; leave_out drops the non-answers), `sums` of a
#             scale's answers (net better = better less worse, in points), or `rows`: each row of a grid, its answers
#             matching `plus` less those matching `minus`
#   answer    the name of one answer (the filter's label); all / each: what the bars show, for everyone and side by
#             side for a kind's groups; asked: the question in the source line
family: CSI-US
study_type: tracker
# answers that are no answer: "None of these", the catch-all "Other" / "Other (please specify)", "Don't know" /
# "Don't recall", "Prefer not to say" (a real answer starting with Other stays: "Other savings / investments")
leave_out: "^(none of|other\\s*($|[-–(])|don.?t (know|recall)|prefer not)"
# groups that are no group (the research team, 25 Nov 2026): household income's "Prefer not to say / answer"
leave_out_groups: {income_band: "^prefer not"}

outlook: &outlook
  - {name: Net better, plus: better, minus: worse}
  - {name: Better, plus: better}
  - {name: About the same, plus: same}
  - {name: Worse, plus: worse}
  - {name: Don't know, plus: "know|sure"}
expenses: &expenses
  codes: [Q6]
  wording: how have your expenses changed
  answer: Category
  asked: question q6, how expenses changed in the last twelve months (asked since July 2026)

topics:
  activities:
    title: Activities & retailers
    lede: "What people did, and where they bought food and nonfood products, in the past two weeks: every week since December 2020."
    tabs:
      - name: Activities
        codes: [Q1, Q3]
        wording: have you done in the past two weeks
        answer: Activity
        all: Percentage of respondents who did each in the past two weeks
        each: Percentage of each group who did it
        asked: question q1 (asked as Q3 from August 2022 to December 2023), past two weeks
      - name: Food retailers
        codes: [Q4, Q6]
        wording: bought any FOOD products from in the past two weeks
        answer: Retailer
        all: Percentage of respondents who bought food from each retailer in the past two weeks
        each: Percentage of each group who bought food there
        asked: question q4 (asked under other codes in earlier weeks), past two weeks
      - name: Nonfood retailers
        codes: [Q5, Q7]
        wording: bought any NONFOOD products from in the past two weeks
        answer: Retailer
        all: Percentage of respondents who bought nonfood products from each retailer in the past two weeks
        each: Percentage of each group who bought nonfood products there
        asked: question q5 (asked under other codes in earlier weeks), past two weeks
  spending:
    title: Spending pressure
    lede: How people say their household expenses changed in the last twelve months, by category, and where they cut back.
    tabs:
      - name: Expenses up
        <<: *expenses
        rows: {plus: increase}
        all: Percentage of respondents whose expenses rose notably or significantly in the last twelve months
        each: Percentage of each group whose expenses rose
      - name: Expenses down
        <<: *expenses
        rows: {plus: decrease}
        all: Percentage of respondents whose expenses fell notably or significantly in the last twelve months
        each: Percentage of each group whose expenses fell
      - name: Net change
        <<: *expenses
        rows: {plus: increase, minus: decrease}
        all: Expenses up less expenses down, in points
        each: Expenses up less down, in points, for each group
      - name: Where they cut back
        codes: [D15]
        wording: reduced your spending due to higher gas prices
        answer: Category
        all: Of those who cut spending because of higher gas prices, the percentage who cut back on each
        each: Percentage of each group who cut back on it
        asked: question D15, of those who cut spending elsewhere because of higher gas prices (asked since March 2026)
  sentiment:
    title: Consumer sentiment & outlook
    lede: Whether people expect their household's finances and the economy to get better or worse over the next 12 months, and how that differs by group.
    tabs:
      - name: Personal finances
        codes: [CS1, q009]
        wording: discretionary income
        answer: Answer
        sums: *outlook
        all: Whether respondents expect their household's discretionary income to be better or worse over the next 12 months; net better in points
        each: Each group's answer; net better in points
        asked: question CS1 (q009 until May 2025), next 12 months
      - name: Economy
        codes: [CS2]
        wording: economy overall over the next 12 months
        answer: Answer
        sums: *outlook
        all: Whether respondents expect the economy to be better or worse over the next 12 months; net better in points
        each: Each group's answer; net better in points
        asked: question CS2 (q010 and others until 2025), next 12 months
