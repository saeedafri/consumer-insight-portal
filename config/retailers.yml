# Retailer comparison (etl/retailers.py → the Retailers screen, frontend/src/screens/Retailers.tsx): two retailers side
# by side from the weekly tracker. Change it here: no code changes needed.
#
#   reach      the weekly retailer questions (multi-choice, asked of everyone): a retailer "reached" someone who chose
#              it in either; food and nonfood are also kept apart
#   pool       weeks the screen adds together at first (any weeks can be chosen): a retailer like Costco has 60-115
#              buyers a week, too few to split by income on its own (the weekly report pools 4 weeks for the same reason)
#   min_buyers a retailer's shopper profile is shown only from this many buyers in the pooled weeks (HIDDEN_BASE)
#   sentiment  the apparel module's "How do you feel about each of the following retailers?" (a grid), asked in apparel
#              weeks only and of 28 apparel retailers: positive = these answers among those asked
#   aliases    a retailer the sentiment grid spells differently from the weekly questions (weekly name: grid name)
#   profile    the respondent groups of each profile, in order; income bands are joined into the design's four.
#              Sectors (config/sectors.yml, those with a Retailers table) are added from their own questions

reach:
  food: q4
  nonfood: q5
pool: 4
min_buyers: 30
sentiment:
  question: AP8
  positive: ["Very positive", "Somewhat positive"]
aliases:
  "T.J. Maxx/Marshalls/HomeGoods/HomeSense/Sierra": "T.J Maxx/Marshalls"
profile:
  gender:
    Male: [Male]
    Female: [Female]
  generation:
    Gen Z: [GenZ]
    Millennial: [Millennial]
    Gen X: [GenX]
    Boomer: [Boomer]
  income:
    Under $50K: ["under $25,000", "$25,000 - $49,999"]
    $50K-$99K: ["$50,000 - $99,999"]
    $100K-$149K: ["$100,000 - $149,999"]
    $150K+: ["$150,000 - $199,999", "$200,000 or greater"]
  region:
    Northeast: [Northeast]
    Midwest: [Midwest]
    South: [South]
    West: [West]
  area:
    Urban: [Urban]
    Suburban: [Suburban]
    Rural: [Rural]
