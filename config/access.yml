# Who may use the portal and what they see (shared/core/access.py). Read once per API process; restart to apply.
#
#   tiers     a package: the features it includes and the study types it opens ("*" = all)
#   roles     each role and its permissions (shared/core/access.py can()): admin_pages (Logs, Fieldwork, the audit log,
#             revoking sessions), manage_team_items (remove anyone's boards and views), all_features (every feature and
#             survey whatever the tier), unlimited (no rate limit), manage_roles (the Access screen: each role's menus).
#             "*" = all of them. A new role: add it here, then its people
#   people    roles given to named people (the super admin); everyone else is an analyst (staff) or a client (by domain)
#   staff     Coresight's own sign-in domains and their tier: staff are analysts of no client
#   clients   an organisation: its sign-in email domains, its tier, and (for a client-commissioned study) the families it owns
#   surveys   who owns a study and who sees it: visibility "all" (every signed-in user), "client" (its owner and staff),
#             "staff" (Coresight only). A survey_id entry beats a family entry; anything unlisted is `default_visibility`.
#   unknown   an email that is neither staff nor a client's: its profile, or `refuse` to turn the sign-in away
#
# With this file as it is, everyone sees everything (the demo): every study is "all" and unknown emails get `enterprise`.
# Before external clients: set unknown to refuse, list each client's domains, and give client studies visibility "client".

# Every switchable feature: most are a menu (the super admin turns them on and off per role on the Access screen,
# stored in cip_role_access); export, alerts and saved_views are actions inside screens. Survey library, a wave's
# Overview, Methodology, What's new and My account are always there; Logs, Fieldwork and Access are the super admin's.
features: [dashboards, explorer, crosstab, trends, compare, audiences, changes, report, survey, search, schedule, ask, boards,
           sectors, expectations, export, alerts, saved_views, fieldwork]
chosen_only: [fieldwork]   # features no package includes: a role gets one only once the super admin turns it on
feature_labels:   # the names the Access screen shows
  dashboards: Topic dashboards (on a wave's Overview)
  explorer: Question explorer
  crosstab: Cross-tab matrix
  trends: Trends
  compare: Compare waves
  audiences: Audiences
  changes: What changed
  report: Weekly report
  survey: Survey preview
  search: Search questions
  schedule: Launch schedule
  ask: Ask CIP
  boards: Boards
  sectors: Sector databank
  expectations: Expected vs actual
  export: Export (CSV, Excel, PowerPoint)
  alerts: Alerts
  saved_views: Saved views
  fieldwork: Fieldwork (each survey's funnel and why respondents dropped out; no deletion schedule, no Forsta user emails)

tiers:
  demo:         {features: [dashboards, explorer, trends, search], study_types: [tracker]}
  core:         {features: [dashboards, explorer, crosstab, trends, search, export, saved_views], study_types: [tracker, annual]}
  professional: {features: [dashboards, explorer, crosstab, trends, search, ask, export, boards, audiences, alerts, saved_views],
                 study_types: [tracker, annual, adhoc]}
  enterprise:   {features: "*", study_types: "*"}

roles:
  super_admin: {permissions: "*"}   # the portal's owner: everything
  analyst:     {permissions: []}    # Coresight staff: the analysis screens of the staff tier
  client:      {permissions: []}    # an external organisation: its tier, its own and public studies (none set up yet)

people:
  super_admin: [mohdsaeedafri@coresight.com]   # Mohd Saeed Afri

staff:
  domains: [coresight.com, cip]   # cip: the pipeline's own service sessions (publish@cip warms nginx's cache)
  tier: enterprise

clients: {}
#  t-mobile: {name: T-Mobile, domains: [t-mobile.com], tier: professional, families: [T_MOBILE]}

surveys:
  default_visibility: all
  families:   # client-commissioned studies: owner client id (a key of `clients`, or null while it has no sign-in) and visibility
    T_MOBILE:        {client: null, visibility: all}
    BOARD:           {client: null, visibility: all}
    ROKBOT:          {client: null, visibility: all}
    SIMBE_ROBOTICS:  {client: null, visibility: all}
    ARC:             {client: null, visibility: all}
    APTOS_CLOUD_POS: {client: null, visibility: all}
    ZEBRA_ELO:       {client: null, visibility: all}
  ids: {}     # survey_id: {client, visibility}

unknown: {role: analyst, tier: enterprise}   # `refuse` before launch

# Per signed-in person, per worker: requests allowed per minute (a token bucket that refills evenly)
limits:
  ask: 10
  export: 30
  audience: 60
  api: 120             # API key and MCP connector requests a minute, per person
min_audience: 1       # every audience shows its figures, however small (the user's rule, 23 Oct 2026; was 30, a differencing guard)
max_body_kb: 1024     # request bodies larger than this get 413
