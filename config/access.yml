# Who may use the portal and what they see (shared/core/access.py). Read once per API process; restart to apply.
#
#   tiers     a package: the features it includes and the study types it opens ("*" = all)
#   roles     each role and its permissions (shared/core/access.py can()): admin_pages (Logs, Fieldwork, the audit log,
#             revoking sessions), manage_team_items (remove anyone's boards and views), all_features (every feature and
#             survey whatever the tier), unlimited (no rate limit), manage_roles (the Access screen: each role's menus).
#             "*" = all of them. A new role: add it here, then its people
#   people    roles given to named people (the super admin); everyone else is an analyst (staff) or a client (by domain)
#   staff     Coresight's own sign-in domains and their tier: staff are analysts of no client
#   clients   an organisation: its sign-in email domains, its tier, and (for a client-commissioned study) the families it owns
#   surveys   who owns a study and who sees it: visibility "all" (every signed-in user), "client" (its owner and staff),
#             "staff" (Coresight only). A survey_id entry beats a family entry; anything unlisted is `default_visibility`.
#   unknown   an email that is neither staff nor a client's: its profile, or `refuse` to turn the sign-in away
#
# With this file as it is, everyone sees everything (the demo): every study is "all" and unknown emails get `enterprise`.
# Before external clients: set unknown to refuse, list each client's domains, and give client studies visibility "client".

# Every switchable feature: each is one entry of the left menu, a screen of a survey wave, or an action inside screens
# (export, alerts, saved_views, weighted, api). The super admin turns them on and off per role, client or person on the
# Access screen (stored in cip_role_access); `menu` below arranges them as the left menu does. Home and a wave's
# Overview are always there, and Access is the super admin's alone: whoever had it could give themselves everything.
features: [library, search, schedule, boards,
           us_tracker, china_tracker, channels, retailers, sectors, expectations,
           dashboards, explorer, crosstab, trends, compare, audiences, changes, report, survey,
           tracker_tariffs_inflation, tracker_financial_health, tracker_genai, tracker_glp1, tracker_mideast_gas,
           tracker_holiday_tracker, tracker_holiday_outlook, tracker_social_commerce,
           methodology, whats_new,
           fieldwork, forsta_reports, forsta_check, forsta_crosstab, forsta_samples, forsta_warnings, forsta_files,
           forsta_deletion, forsta_account,
           ingest, logs,
           ask, export, alerts, saved_views, weighted, api]
# features no package includes: a role gets one only once the super admin turns it on (the admin pages, which only
# the super admin had before 15 Nov 2026)
chosen_only: [fieldwork, forsta_reports, forsta_check, forsta_crosstab, forsta_samples, forsta_warnings, forsta_files,
              forsta_deletion, forsta_account, ingest, logs]
# menus split off an older one on 15 Nov 2026 (shared/core/access.py grown): a package, or an Access choice saved before
# then, gives each what the menu it grew from gave ("*": always on then), so nobody lost a menu when the list grew
grown_from:
  library: "*"
  us_tracker: "*"
  china_tracker: "*"
  methodology: "*"
  whats_new: "*"
  channels: explorer
  tracker_tariffs_inflation: dashboards
  tracker_financial_health: dashboards
  tracker_genai: dashboards
  tracker_glp1: dashboards
  tracker_mideast_gas: dashboards
  tracker_holiday_tracker: dashboards
  tracker_holiday_outlook: dashboards
  tracker_social_commerce: dashboards
# a weekly tracker's waves open only with its menu: Library, Search, Ask, Trends and every wave screen (access.sees)
family_menus: {CSI-US: us_tracker, CSI-CN: china_tracker}
# the left menu as the Access screen offers it, group by group (frontend/src/components/Shell.tsx draws the same, and
# tests/test_access.py checks every feature is here once): a key, or {label, always} (on for everyone), {label, admin}
# (the super admin's alone), {label, children} (a menu with pages of its own)
menu:
  - {group: Explore, items: [{label: Home, always: true}, library, search, schedule, boards]}
  - {group: Core research, items: [us_tracker, china_tracker, channels, retailers, sectors, expectations,
      {label: "A survey wave's screens (its tabs)", children: [{label: Overview, always: true}, dashboards, explorer, crosstab,
                                                            trends, compare, audiences, changes, report, survey]}]}
  - {group: Trackers, items: [tracker_tariffs_inflation, tracker_financial_health, tracker_genai, tracker_glp1,
      tracker_mideast_gas, tracker_holiday_tracker, tracker_holiday_outlook, tracker_social_commerce]}
  - {group: Reference, items: [methodology, whats_new]}
  - {group: Research operations, items: [fieldwork, forsta_reports, forsta_check, forsta_crosstab, forsta_samples,
      forsta_warnings, forsta_files, forsta_deletion, forsta_account]}
  - {group: Administration, items: [ingest, logs, {label: Access, admin: true}]}
  - {group: On every screen, items: [ask, export, alerts, saved_views, weighted, api]}
feature_labels:   # the names the Access screen shows
  library: Survey library
  us_tracker: Shopping & Spending (the weekly US tracker's waves)
  china_tracker: China weekly tracker (its waves)
  channels: In store vs online
  tracker_tariffs_inflation: Tariffs & inflation
  tracker_financial_health: Financial health
  tracker_genai: GenAI & AI shopping
  tracker_glp1: GLP-1 impact
  tracker_mideast_gas: Gas prices & geopolitics
  tracker_holiday_tracker: Holiday shopping
  tracker_holiday_outlook: Holiday outlook
  tracker_social_commerce: Social commerce
  methodology: Methodology
  whats_new: What's new
  forsta_reports: Team reports (Forsta)
  forsta_check: Forsta vs CIP
  forsta_crosstab: Cross-tab setup (Forsta)
  forsta_samples: Sample & devices (Forsta)
  forsta_warnings: Warnings & checks (Forsta)
  forsta_files: Survey files (Forsta)
  forsta_deletion: Archive & deletion (Forsta)
  forsta_account: Forsta account (its users, endpoints and unloaded surveys)
  ingest: Upload survey
  logs: Logs (requests, health, Ask checks and the raw logs)
  dashboards: Topic dashboards (on a wave's Overview)
  explorer: Question explorer
  crosstab: Cross-tab matrix
  trends: Trends
  compare: Compare waves
  audiences: Audiences
  changes: What changed
  report: Weekly report
  survey: Survey preview
  search: Search questions
  schedule: Launch schedule
  ask: Ask Coresight
  boards: Boards
  sectors: Sector databank
  retailers: Retailer databank
  expectations: Expected vs actual
  export: Export (CSV, Excel, PowerPoint)
  alerts: Alerts
  saved_views: Saved views
  weighted: Weighted figures (the Weighted switch in the header; Census-weighted by gender, age and region)
  api: API keys and MCP (the Account page's keys, the API guide, and every request made with a key)
  fieldwork: Fieldwork (each survey's funnel and why respondents dropped out; no deletion schedule, no Forsta user emails)

tiers:
  demo:         {features: [dashboards, explorer, trends, search], study_types: [tracker]}
  core:         {features: [dashboards, explorer, crosstab, trends, search, export, saved_views], study_types: [tracker, annual]}
  professional: {features: [dashboards, explorer, crosstab, trends, search, ask, export, boards, audiences, alerts, saved_views],
                 study_types: [tracker, annual, adhoc]}
  enterprise:   {features: "*", study_types: "*"}

roles:
  super_admin: {permissions: "*"}   # the portal's owner: everything
  analyst:     {permissions: []}    # Coresight staff: the analysis screens of the staff tier
  client:      {permissions: []}    # an external organisation: its tier, its own and public studies (none set up yet)
  service:     {permissions: [all_features]}   # the pipeline's own sessions: every answer, no admin pages

people:
  super_admin: [mohdsaeedafri@coresight.com, preranakotian@coresight.com]   # Mohd Saeed Afri, Prerana Kotian (10 Nov 2026)
  service: [publish@cip]   # warms nginx's shared cache, so must see what everyone may (etl/publish.py ask_nginx)

staff:
  domains: [coresight.com]
  tier: enterprise

clients: {}
#  t-mobile: {name: T-Mobile, domains: [t-mobile.com], tier: professional, families: [T_MOBILE]}

surveys:
  default_visibility: all
  families:   # client-commissioned studies: owner client id (a key of `clients`, or null while it has no sign-in) and visibility
    T_MOBILE:        {client: null, visibility: all}
    BOARD:           {client: null, visibility: all}
    ROKBOT:          {client: null, visibility: all}
    SIMBE_ROBOTICS:  {client: null, visibility: all}
    ARC:             {client: null, visibility: all}
    APTOS_CLOUD_POS: {client: null, visibility: all}
    ZEBRA_ELO:       {client: null, visibility: all}
  ids: {}     # survey_id: {client, visibility}

unknown: {role: analyst, tier: enterprise}   # `refuse` before launch

# Per signed-in person, per worker: requests allowed per minute (a token bucket that refills evenly)
limits:
  ask: 10
  ask_check: 10        # the page's AI check of an unsure quick answer: at most one per question asked
  ask_suggest: 240     # suggestions while someone types in Ask, after each pause
  search: 120          # a search box used as people type stays well under it
  export: 30
  audience: 60
  api: 120             # API key and MCP connector requests a minute, per person
min_audience: 1       # every audience shows its figures, however small (the user's rule, 23 Oct 2026; was 30, a differencing guard)
max_body_kb: 1024     # request bodies larger than this get 413
