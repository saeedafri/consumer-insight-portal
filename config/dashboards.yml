# SAMPLE screen definitions for the backend (api/dashboards.py), stored in its cip_dash_* cache tables
# (sql/006_dashboards.sql). Not used by the ETL. Every number comes from the ETL's serving rows
# (srv_result): n / base_n for the listed answer codes (single-choice) or item labels (multi-choice).
#
#   tiles     → one percentage each, with prior-week and last-year comparisons
#   lists     → a ranked multi-choice question (top N, e.g. retailers); its #1 can be a tile
#   segments  → one tile metric across a demographic cut (generation, age_band, …)
#   aliases   → older codes of the same question: {old: configured}
#   say/head  → the key-takeaway wording: "<head>: <pct>% <say>"; a list's `tile` shows its #1 as a tile
#
# Single-choice codes are the Forsta value codes. A wave where they carry other labels than in most waves
# (a question code reused for another question) is left out of that tile; python -m api.dashboards --check lists them.
#
# prior      = previous series_wave_no of the same module and season (cip_wave_module); prior_label names it
# last year  = ly_rule: same_wave_number (wave N of last season, as the business team's Databank does)
#              or same_calendar_week (the wave launched within ±3 days of one year earlier)
#              or nearest_year_ago (the wave closest to one year earlier, within a month: monthly topics)

holiday_tracker:
  title: Holiday Survey Databank
  module: HOLIDAY_TRACKER
  small_base: 50                      # flag any percentage on fewer respondents than this
  ly_rule: same_wave_number           # "vs LY" = the same wave number last season (Databank definition)
  prior_label: last week
  tiles:
    - {code: not_started, label: Not started,           qcode: XM3, codes: [1],    head: Progress, say: have not started holiday shopping}
    - {code: started,     label: Started,               qcode: XM3, codes: [2, 3], head: Progress, say: have started}
    - {code: finished,    label: Finished,              qcode: XM3, codes: [3],    head: Progress, say: have finished}
    - {code: bought_7d,   label: Bought in past 7 days, qcode: XM1, codes: [1],    head: Activity, say: bought for the holidays in the past 7 days}
  lists:
    - {code: retailers,  qcode: XM2,  top: 5, exclude: [None of these], head: Retailers, say: lead among holiday purchasers,
       tile: "#1 holiday retailer", of: of purchasers}
    - {code: categories, qcode: XM1A, top: 5, exclude: [Other - please specify], head: Categories, say: lead the holiday basket}
  segments:
    - {code: started_by_generation, of: started, dim: generation, order: [GenZ, Millennial, GenX, Boomer],
       say: "By generation, started holiday shopping"}

tariffs_inflation:
  title: Tariffs and Inflation Tracker
  module: TARIFFS_INFLATION
  small_base: 50
  ly_rule: nearest_year_ago
  tiles:
    - {code: prices_risen,     label: See prices rising,         qcode: IN1, codes: [1],    head: Prices, say: notice prices have generally risen}
    - {code: hurts_me,         label: Tariffs hurt me,           qcode: TF1, codes: [1, 2], head: Tariffs, say: say tariffs hurt them personally}
    - {code: hurts_economy,    label: Tariffs hurt the economy,  qcode: TF2, codes: [1, 2], head: Tariffs, say: say they hurt the US economy}
    - {code: changing_habits,  label: Changing how they shop,    qcode: TF5, codes: [1],    head: Behavior, say: have changed or expect to change how they shop to avoid tariffs}
  lists:
    - {code: grocery_moves,    qcode: IN2, top: 5, exclude: [No change, Other (please specify)], head: Grocery response to prices,
       say: are the top moves, tile: "#1 grocery response", of: of shoppers}
    - {code: tariff_concerns,  qcode: TF3, top: 5, exclude: [None of these, Other (please specify)], head: Tariff concerns, say: worry consumers most}
  segments:
    - {code: hurts_me_by_generation, of: hurts_me, dim: generation, order: [GenZ, Millennial, GenX, Boomer],
       say: "By generation, say tariffs hurt them personally"}

mideast_gas:
  title: Middle East Conflict and Gas Prices
  module: MIDEAST_GAS
  small_base: 50
  ly_rule: nearest_year_ago
  tiles:
    - {code: following,     label: Following the conflict,     qcode: D12, codes: [3, 4], head: Attention, say: pay some or a lot of attention to the conflict}
    - {code: following_lot, label: Following it a lot,         qcode: D12, codes: [4],    head: Attention, say: a lot}
    - {code: cut_back,      label: Cut spending due to gas,    qcode: D14, codes: [1],    head: Spending, say: have cut spending elsewhere because of higher gas prices}
  lists:
    - {code: cutbacks, qcode: D15, top: 5, exclude: [Other (please specify), None of these], head: Where they cut back,
       say: are cut most, tile: "#1 area cut back", of: of those cutting back}
  segments:
    - {code: cut_back_by_generation, of: cut_back, dim: generation, order: [GenZ, Millennial, GenX, Boomer],
       say: "By generation, cut spending because of gas prices"}

