# SAMPLE screen definitions for the backend (api/dashboards.py), stored in its cip_dash_* cache tables
# (sql/006_dashboards.sql). Not used by the ETL. Every number comes from the ETL's serving rows
# (srv_result): n / base_n for the listed answer codes (single-choice) or item labels (multi-choice).
#
#   tiles     → one percentage each, with prior-week and last-year comparisons
#   lists     → a ranked multi-choice question (top N, e.g. retailers); its #1 can be a tile
#   segments  → one tile metric across a demographic cut (generation, age_band, …)
#
# prior week = previous series_wave_no of the same module and season (cip_wave_module)
# last year  = ly_rule: same_wave_number (wave N of last season, as the business team's Databank does)
#              or same_calendar_week (the wave launched within ±3 days of one year earlier)

holiday_tracker:
  title: Holiday Survey Databank
  module: HOLIDAY_TRACKER
  small_base: 50                      # flag any percentage on fewer respondents than this
  ly_rule: same_wave_number           # "vs LY" = the same wave number last season (Databank definition)
  tiles:
    - {code: not_started, label: NOT YET STARTED,       qcode: XM3, codes: [1]}
    - {code: started,     label: STARTED SHOPPING,      qcode: XM3, codes: [2, 3]}
    - {code: finished,    label: FINISHED SHOPPING,     qcode: XM3, codes: [3]}
    - {code: bought_7d,   label: BOUGHT IN PAST 7 DAYS, qcode: XM1, codes: [1]}
  lists:
    - {code: retailers,  label: "#1 HOLIDAY RETAILER", qcode: XM2,  top: 5, exclude: [None of these]}
    - {code: categories, label: TOP CATEGORIES,        qcode: XM1A, top: 5, exclude: [Other - please specify]}
  segments:
    - {code: started_by_generation, of: started, dim: generation, order: [GenZ, Millennial, GenX, Boomer]}
