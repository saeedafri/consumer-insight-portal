financial_health:
  title: Consumer Financial Health
  module: FINANCIAL_HEALTH
  small_base: 50
  ly_rule: nearest_year_ago
  tiles:
    - {code: savings_month,  label: Savings last under a month, qcode: F1, codes: [1, 2, 3], head: Savings, say: could cover their bills for less than a month from savings}
    - {code: savings_week,   label: Savings last under a week,  qcode: F1, codes: [1],       head: Savings, say: for less than a week}
    - {code: low_debt,       label: Low unsecured debt,         qcode: F2, codes: [1],       head: Debt, say: owe unsecured debt under 25% of monthly income}
    - {code: windfall,       label: Expect a windfall,          qcode: F3, codes: [1, 2],    head: Windfall, say: "expect a windfall (stimulus, loan forgiveness, inheritance) in the next 12 months"}
  lists: []
  segments:
    - {code: savings_month_by_generation, of: savings_month, dim: generation, order: [GenZ, Millennial, GenX, Boomer],
       say: "By generation, savings would last under a month"}

glp1:
  title: GLP-1 Tracker
  module: GLP1
  small_base: 50
  ly_rule: nearest_year_ago
  tiles:
    - {code: using,       label: Using a GLP-1 drug,  qcode: GP1, codes: [1],    head: Usage, say: of US adults are using a GLP-1 drug like Ozempic}
    - {code: weight_loss, label: Taking it for weight loss, qcode: GP2, codes: [1, 2], head: Usage, say: of users take it for weight loss}
    - {code: eating_less, label: Eating less,         qcode: GP3, codes: [4, 5], head: Eating, say: of users eat less than before}
  lists:
    - {code: changes, qcode: GP5, top: 5, exclude: [None of these], head: Since starting,
       say: are the top changes among users, tile: "#1 change since starting", of: of users}
    - {code: how_less, qcode: GP4, top: 3, exclude: [None of these], head: How they eat less, say: lead among users eating less}
  segments:
    - {code: using_by_generation, of: using, dim: generation, order: [GenZ, Millennial, GenX, Boomer],
       say: "By generation, using a GLP-1 drug"}

holiday_outlook:
  title: Holiday Outlook
  module: HOLIDAY
  small_base: 50
  ly_rule: nearest_year_ago
  tiles:
    - {code: spend_more,     label: Will spend more,        qcode: HX2, codes: [4, 5], head: Holiday spending, say: expect to spend more than last year}
    - {code: spend_less,     label: Will spend less,        qcode: HX2, codes: [1, 2], head: Holiday spending, say: expect to spend less}
    - {code: inflation_up,   label: Expect higher inflation, qcode: HX4, codes: [1],   head: Inflation, say: expect inflation to be higher by December}
    - {code: finances_worse, label: Finances worse,          qcode: HX5, codes: [4, 5], head: Finances, say: expect their finances to be worse this holiday than last}
  lists: []
  segments:
    - {code: spend_more_by_generation, of: spend_more, dim: generation, order: [GenZ, Millennial, GenX, Boomer],
       say: "By generation, expect to spend more this holiday"}

