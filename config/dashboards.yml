    - {code: shop_intent, label: Plan to shop with GenAI,   qcode: G6A, codes: [2, 3], head: Shopping, say: plan or would like to}
    - {code: work_use,    label: Use GenAI for work,        qcode: G6,  codes: [2, 3], head: Work, say: of users use GenAI for work (alone or with personal use)}
  lists:
    - {code: tools, qcode: G5, top: 5, exclude: [None of these, Other (please specify)], head: Tools used,
       say: are the most used, tile: "#1 GenAI tool", of: have used it}
    - {code: worries, qcode: G8, top: 5, exclude: [None of these, Other (please specify)], head: Worries, say: worry consumers most}
