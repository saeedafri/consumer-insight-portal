      "珠宝首饰或手表": "Jewelry or watches"
      "家居装潢产品": "Home improvement products"
      "以上皆无": "None of the above"
  Q6:
    text: "In the past two weeks, which of the following product categories have you purchased online? (Select all that apply)"
    type: multi
    answers:
      "珠宝首饰或手表": "Jewelry or watches"
      "美容护肤产品或化妆品": "Beauty, skincare or cosmetics"
      "运动健身产品（不包括运动服装及运动鞋）": "Sports and fitness products (excl. sportswear and athletic footwear)"
      "服饰，鞋等时尚产品": "Apparel, footwear and other fashion products"
