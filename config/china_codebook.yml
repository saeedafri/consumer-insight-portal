# The China Consumer Survey (Baidu QSS) in English: every question's wording and every answer, keyed by the exact
# Chinese text Baidu writes in the raw export and the topline. Read by etl/baidu_qss_export.py on every load (the
# Upload survey page and the SharePoint watcher, etl/sharepoint_china.py).
#
# The English is the analysts' own (zh_en_dictionary.json, 11 Nov 2026), keyed by the Chinese like this file, with two
# exceptions the demographic cuts need:
#   S2 ages are "26-41 years old", not "26-41": US history already has bare "26-41" answers, which must keep no band
#      (etl/survey_map.py classify_age, config/survey_map.yml age_band_labels).
#   S4 city tiers are "Tier 1 city" without the list of cities: a cut value fits 20 characters (cip_profile.urbanicity);
#      the cities are in the question's Chinese and in the analysts' dictionary.
# The older positional converter ("Consumer Tracker English.xlsx") is not used: its Q8/Q9 rows put "Pessimistic"
# beside 积极 (positive).
#
# The questions never change between weeks, only the people. An answer's code is its place in its list, so add a
# new answer at the END of its list: codes already loaded keep their meaning. A Chinese wording this file does not
# know stops the load and is named, so nothing untranslated reaches the screens.

family: CSI-CN
questions:
  S1:
    text: "What is your gender? (Select one)"
    type: single
    answers:
      "男": "Male"
      "女": "Female"
  S2:
    text: "What is your age? (Select one)"
    type: single
    answers:
      "18岁以下": "Under 18"
      "18-25岁": "18-25 years old"
      "26-41岁": "26-41 years old"
      "42-57岁": "42-57 years old"
      "57-76岁": "57-76 years old"
      "77岁或以上": "77 years old or above"
  S3:
    text: "What is your monthly income? (Select one)"
    type: single
    answers:
      "0-5,000 元": "RMB 0-5,000"
      "5,001-10,000 元": "RMB 5,001-10,000"
      "10,001-15,000 元": "RMB 10,001-15,000"
      "15,001-20,000 元": "RMB 15,001-20,000"
      "20,001-25,000 元": "RMB 20,001-25,000"
      "25,001 元或以上": "RMB 25,001 or above"
  S4:
    text: "Which city do you currently live in? (Select one)"
    type: single
    answers:
      "一线城市（包括：北京，上海，广州，深圳）": "Tier 1 city"
      "二线城市（包括：成都、重庆、杭州、武汉、南京、天津、苏州、西安、长沙、沈阳、青岛、郑州、大连、东莞、宁波、厦门、福州、无锡、合肥、昆明、哈尔滨、济南、佛山、长春、温州、石家庄、南宁、常州、泉州、南昌、贵阳、太原、烟台、嘉兴、南通、金华、珠海、惠州、徐州、海口、乌鲁木齐、绍兴、中山、台州、九江）": "Tier 2 city"
      "其他城市": "Other city"
  S5:
    text: "How many children do you currently have? (Select one)"
    type: single
    answers:
      "没有小孩": "No children"
      "一个": "One"
      "两个": "Two"
      "三个": "Three"
      "三个以上": "More than three"
  Q1:
    text: "Over the next two weeks, how will your spending on everyday consumer goods and dining change compared with now? (Select one)"
    type: single
    answers:
      "减少很多": "Decrease a lot"
      "减少一些": "Decrease somewhat"
      "维持不变": "Stay the same"
      "增加一些": "Increase somewhat"
      "增加很多": "Increase a lot"
  Q2:
    text: "Given the current situation, are you currently avoiding public places such as shopping malls and offices, or changing travel plans?"
    type: single
    answers:
      "有": "Yes"
      "没有": "No"
  Q3:
    text: "Which public places are you currently avoiding, or which travel plans and activities are you changing? (Select all that apply)"
    type: multi
    answers:
      "购物中心": "Shopping malls"
      "大型体育活动（如马拉松比赛，足球，飞盘等）": "Large sporting events (e.g., marathons, soccer, frisbee)"
      "国内旅行（包括因公或因私）": "Domestic travel (business or personal)"
      "海外旅行（包括因公或因私）": "Overseas travel (business or personal)"
      "办公室": "Offices"
      "医院或社区医疗中心": "Hospitals or community health centers"
      "美容美发美甲中心": "Beauty, hair and nail salons"
      "餐厅/酒吧/咖啡店": "Restaurants/bars/coffee shops"
      "公共交通（例如地铁，火车等）": "Public transport (e.g., subway, trains)"
      "商店/超市": "Stores/supermarkets"
      "健身房/体育中心": "Gyms/sports centers"
      "会议/贸易展": "Conferences/trade shows"
      "娱乐场所（例如：电影院，主题乐园等）": "Entertainment venues (e.g., movie theaters, theme parks)"
      "其他（请注明____）": "Other (please specify)"
  Q4:
    text: "In the past two weeks, which of the following activities have you taken part in? (Select all that apply)"
    type: multi
    answers:
      "和在同一座城市的朋友或者家人见面": "Met friends or family in the same city"
      "去亲近大自然": "Spent time in nature"
      "自我提升": "Self-improvement"
      "玩电脑/电竞游戏": "Played computer/esports games"
      "看电视/短视频/直播": "Watched TV/short videos/livestreams"
      "躺平": "Lying flat (resting, doing nothing)"
      "参与体育活动（例如，马拉松，足球，飞盘等）": "Took part in sports (e.g., marathons, soccer, frisbee)"
      "去购物中心": "Went to shopping malls"
      "国内旅行（包括因公或因私）": "Domestic travel (business or personal)"
      "海外旅行（包括因公或因私）": "Overseas travel (business or personal)"
      "去办公室": "Went to the office"
      "医院或社区医疗中心": "Hospitals or community health centers"
      "美容美发美甲中心": "Beauty, hair and nail salons"
      "餐厅/酒吧/咖啡店": "Restaurants/bars/coffee shops"
      "公共交通（例如地铁，火车等）": "Public transport (e.g., subway, trains)"
      "商店/超市": "Stores/supermarkets"
      "健身房/体育中心": "Gyms/sports centers"
      "会议/贸易展": "Conferences/trade shows"
      "娱乐场所（例如：电影院，主题乐园等）": "Entertainment venues (e.g., movie theaters, theme parks)"
      "其他（请注明____）": "Other (please specify)"
  Q5:
    text: "In the past two weeks, which of the following product categories have you purchased in physical stores? (Select all that apply)"
    type: multi
    answers:
      "运动健身产品（不包括运动服装及运动鞋）": "Sports and fitness products (excl. sportswear and athletic footwear)"
      "日常家居用品（包括清洁产品，卫生纸，洗衣类产品等）": "Household essentials (incl. cleaning products, toilet paper, laundry products)"
