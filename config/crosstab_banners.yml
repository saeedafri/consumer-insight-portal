  - label: Somewhat worse
    expr: CS1.r2
  - label: About the same
    expr: CS1.r3
  - label: Somewhat better
    expr: CS1.r4
  - label: Much better
    expr: CS1.r5
  - label: Don't know / not sure
    expr: CS1.r6
  - label: Not yet started
    expr: XM3.r1
  - label: Still shopping
    expr: XM3.r2
  - label: Finished shopping
    expr: XM3.r3
  - label: Do not make holiday purchases
