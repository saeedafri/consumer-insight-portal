# The weekly "US Consumer Survey Insights" report (etl/weekly_report.py): which tracker question feeds which section,
# the three income groups, and how a net score is read. Change it here: no code changes needed.

# the weekly US tracker: the survey family and study type whose waves get a report
family: CSI-US
study_type: tracker
title: US Consumer Survey Insights
population: US adults 18+

# a table's weeks of four-week averages and how far back its long change looks (12 weeks: the three-month change)
table_weeks: 13
change_weeks: 12
change_label: Three-month change

# the report's 13-week tables, in the order shown: the part of the report, the table's title, its short name (used in
# "Three data points to watch") and the weekly tracker question (CSI-US) it reads
sections:
  - {part: "Where consumers are shopping", name: "Food retailers", question: q4,
     title: "Food: retailers they bought food from in the past two weeks"}
  - {part: "Where consumers are shopping", name: "Nonfood retailers", question: q5,
     title: "Nonfood: retailers they bought nonfood products from in the past two weeks"}
  - {part: "What consumers are buying", name: "Bought in store", question: q2,
     title: "Product categories they bought in store in the past two weeks"}
  - {part: "What consumers are buying", name: "Bought online", question: q3,
     title: "Product categories they bought online in the past two weeks"}
  - {part: "Consumer activities", name: "Activities", question: q1,
     title: "Activities they have done in the past two weeks"}

# the two sentiment questions: net better = % better minus % worse
sentiment:
  Personal finances: CS1    # household financial situation over the next 12 months
  Economy: CS2              # the economy overall over the next 12 months

# the report's three income groups, each the portal's finer bands added together (D5 answers)
income_groups:
  "<$50,000": ["under $25,000", "$25,000 - $49,999"]
  "$50,000 to <$100,000": ["$50,000 - $99,999"]
  "$100,000+": ["$100,000 - $149,999", "$150,000 - $199,999", "$200,000 or greater"]

net_name: Net better
appendix_each_answer: false   # the appendix lists total worse, total better and net better
news_events: true

# a net score: answers containing a positive word minus answers containing a negative word
net_words:
  positive: [better, more]
  negative: [worse, less]

# answers left out of the 13-week tables (lower case, how the answer starts). The analysts' activities table never
# shows the movie theater and live performance answers (every PDF since Sep 2026 and their Activity sheet).
leave_out_answers: ["none of", "other", "don't know", "prefer not", "gone to a movie theater", "gone to a live performance"]


# the retailer questions whose shoppers get an age and income profile (the cube's midpoints, over the 13 weeks)
profile_questions:
  q4: Food shoppers
  q5: Nonfood shoppers
