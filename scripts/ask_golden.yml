# Ask Coresight's golden set: 150 questions worded the way analysts ask them, each with what a right answer must be.
# Read by scripts/ask_golden.py. Run it locally and on staging before every push (research 11 Nov 2026: Uber, LinkedIn
# and Snowflake each keep 130-150 such questions and score every step).
#
#   q      the question as an analyst would type it
#   want   phrases, any one of which the right survey question's wording contains (lower case); "none" when no
#          survey asks it (the answer must say so)
#   check  optional: trend (a line over periods), cut (grouped by the group asked), top (a ranked list), count
#
# Not to be copied into config/ask_verified.yml: a verified answer for a golden question would test nothing.

# --- Retailers (food and nonfood, the weekly tracker's core)
- {q: "What share bought from Amazon in the latest wave?", want: ["nonfood products from", "food products from"]}
- {q: "What share bought from Amazon in all waves?", want: ["nonfood products from", "food products from"], check: trend}
- {q: "Walmart shoppers over time", want: ["nonfood products from", "food products from"], check: trend}
- {q: "Top food retailers last 8 weeks", want: ["food products from"], check: top}
- {q: "Top nonfood retailers this week", want: ["nonfood products from"], check: top}
- {q: "Which retailers do Gen Z prefer?", want: ["retailers have you bought", "loyal to", "purchased from online"], check: cut}
- {q: "Target food shoppers by income", want: ["food products from"], check: cut}
- {q: "Walmart vs Target nonfood shoppers by generation", want: ["nonfood products from"], check: cut}
- {q: "Costco shoppers", want: ["nonfood products from", "food products from", "warehouse clubs"]}
- {q: "Dollar General shoppers monthly", want: ["nonfood products from", "food products from", "dollar stores have you"], check: trend}
- {q: "Kroger grocery shoppers trend", want: ["food products from"], check: trend}
- {q: "How many people bought food from Aldi?", want: ["food products from"]}
- {q: "Temu shoppers over the last year", want: ["nonfood products from", "purchased from online"]}
- {q: "Amazon vs Walmart for food", want: ["food products from"]}
- {q: "Which online retailers do people buy from?", want: ["purchased from online in the past three months"]}
- {q: "How do people feel about Target?", want: ["how do you feel about"]}
- {q: "Retailers people are loyal to", want: ["loyal to"]}
- {q: "Why are people loyal to a retailer?", want: ["contribute to your loyalty"]}
- {q: "Warehouse club shoppers", want: ["warehouse clubs"]}
