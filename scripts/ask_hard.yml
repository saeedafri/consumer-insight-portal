# Ask's hard test set: analyst questions that need more than one survey question, a group, several weeks or a
# test, each with the plan that answers it and the figures worked out from the raw weekly files
# (scripts/ask_hard_truth.py fills `expect`; scripts/ask_hard.py scores Ask). Questions name their weeks, since the raw
# files cover 14 Sep - 16 Nov 2026 only; "latest" is 16 Nov. `parts` says what each one combines, so a score can be
# split by combinations a model has or has not seen. `source`: new (written 22 Nov 2026), chatgpt40 (ChatGPT's answer
# key of 22 Nov 2026, its figures re-worked here: its online groceries were health products), bench20 (the
# 20-question benchmark). A case with `refuse` must be declined with that reason, not answered.
- id: H001
  source: chatgpt40
  parts:
  - per-wave
  - net
  question: What share had started holiday shopping in each of the four survey weeks?
  plan:
    waves:
    - 2026-10-26
    - 2026-11-02
    - 2026-11-09
    - 2026-11-16
    ask:
      q: XM3
      is:
      - Still shopping
      - Finished shopping
  expect:
  - when: '2026-10-26'
    label: share
    pct: 42.6
    n: 172
    base: 404
  - when: '2026-11-02'
    label: share
    pct: 58.8
    n: 237
    base: 403
  - when: '2026-11-09'
    label: share
    pct: 52.2
    n: 211
    base: 404
  - when: '2026-11-16'
    label: share
    pct: 51.7
    n: 209
    base: 404
