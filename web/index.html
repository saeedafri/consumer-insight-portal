<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2D2A29" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Consumer Insight Portal · Coresight Research</title>
    <script>
      // Theme before first paint: the saved choice, else the system setting (no flash of the wrong theme)
      try { var t = localStorage.getItem("cip-theme"); } catch (e) {}
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
