# nginx's logs as files the admins' Logs page reads (api/logs.py), in the Azure App Service image only (deploy/Dockerfile
# target app). One JSON line per request; the content-hashed site files (/_next/) are left out, they are not worth it.
log_format cip_json escape=json '{"time":"$time_iso8601","client":"$remote_addr","method":"$request_method",'
    '"path":"$request_uri","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,'
    '"api_seconds":"$upstream_response_time","cache":"$upstream_cache_status","user":"$cip_user","agent":"$http_user_agent"}';
map $uri $loggable { ~^/_next/ 0; default 1; }
access_log /srv/cip/logs/nginx-access.log cip_json buffer=64k flush=5s if=$loggable;
error_log /srv/cip/logs/nginx-error.log warn;
