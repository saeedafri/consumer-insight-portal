# The TLS server for a VM with IT's certificate (deploy/compose.yml mounts it at /etc/nginx/tls). Not in the Azure App
# Service image (deploy/Dockerfile target app): the platform ends TLS there.
server {
  listen 8443 ssl backlog=65535;
  http2 on;
  ssl_certificate /etc/nginx/tls/cert.pem; ssl_certificate_key /etc/nginx/tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3; ssl_session_cache shared:tls:10m; ssl_session_timeout 1d;
  root /srv/cip;
  include /etc/nginx/cip_locations.conf;
}
