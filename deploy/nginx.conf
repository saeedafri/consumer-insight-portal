# nginx in front of the CIP API on one 1-core server (deploy/compose.yml).
#  - the web app's files and the ETL-published payloads (etl/publish.py) come straight from disk, pre-gzipped:
#    no Python and no database on those requests, so the standard screens stay fast whatever the load
#  - every data file still needs a signed-in session, checked here by deploy/cip_auth.js (the API's own HMAC rule):
#    no request reaches Python just to prove who is asking
#  - ad hoc answers that are the same for every user (cross-tabs, trends, search, results) are cached here until the
#    next publish (etl/publish.py empties CIP_NGINX_CACHE when it swaps in new data, then asks for the newest waves'
#    cross-tabs so they are ready before anyone opens them): the API computes each distinct
#    answer once a week however many people ask (22 Oct 2026 benchmark: .planning/wiki/STRESS_BENCHMARK.md)
#  - the team's own data (boards, alerts, views, audiences) and anything else goes to the API, never cached
load_module modules/ngx_http_js_module.so;
env CIP_SESSION_SECRET;                   # the cookie's signing key, shared with the API (cip_auth.js)
worker_processes 1;                       # one core
events { worker_connections 65536; multi_accept on; }   # 20,000 people with a connection open each, and room
worker_rlimit_nofile 131072;

http {
  include       /etc/nginx/mime.types;
  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 30s; keepalive_requests 10000;
  server_tokens off;
  access_log off;                         # the API logs what it serves; static hits are not worth the CPU
  gzip_static on;                         # send foo.json.gz when the browser accepts gzip
  gzip on; gzip_comp_level 5; gzip_types application/json text/css application/javascript image/svg+xml;
  open_file_cache max=20000 inactive=60s; open_file_cache_valid 30s;

  proxy_cache_path /var/cache/nginx/data levels=1:2 keys_zone=data:16m max_size=512m inactive=7d use_temp_path=off;

  upstream api { server api:8000; keepalive 64; }
  js_import cip_auth from /etc/nginx/cip_auth.js;

  # a runaway script, not an office: 300 requests/s per address is ~50 analysts at once behind one NAT, with room to spare
  limit_req_zone $binary_remote_addr zone=perip:5m rate=300r/s;
  limit_req_status 503;                   # the web app already waits and retries on 503

  server {
    listen 8080 backlog=65535;              # a burst of thousands of new connections waits instead of being reset
    root /srv/cip;
    include /etc/nginx/cip_headers.conf;   # the portal is not embedded elsewhere (X-Frame-Options)

    location = /_auth {                   # the signed cookie, checked in nginx: microseconds, no API call
      internal;
      js_content cip_auth.check;
    }

    # published payloads: the same URLs as the API, the same bytes (app/data/payloads.py), stored gzipped only
    location = /api/v1/waves {
      auth_request /_auth;
      types { } default_type application/json; include /etc/nginx/cip_headers.conf; add_header Cache-Control "private, no-cache"; add_header Content-Encoding gzip;
      try_files /published/current/api/v1/waves.json.gz @api;
    }
    location ~ ^/api/v1/waves/(\d+)/book$ {
      auth_request /_auth;
      types { } default_type application/json; include /etc/nginx/cip_headers.conf; add_header Cache-Control "private, no-cache"; add_header Content-Encoding gzip;
      try_files /published/current/api/v1/waves/$1/book.json.gz @api;
    }
    location ~ ^/api/v1/dashboards/(\w+)/(\d+)$ {
      auth_request /_auth;
      types { } default_type application/json; include /etc/nginx/cip_headers.conf; add_header Cache-Control "private, no-cache"; add_header Content-Encoding gzip;
      try_files /published/current/api/v1/dashboards/$1/$2.json.gz @api;
    }

    location ~ ^/api/v1/questions/([^/]+)/([^/]+)/([^/]+)$ {
      auth_request /_auth;
      types { } default_type application/json; include /etc/nginx/cip_headers.conf; add_header Cache-Control "private, no-cache"; add_header Content-Encoding gzip;
      try_files /published/current/api/v1/questions/$1/$2/$3.json.gz @api;
    }

    # answers that are the same for every signed-in user: computed once per 30 s, then served by nginx
    location = /api/v1/schedule {         # the launch schedule changes during fieldwork: one minute at most
      auth_request /_auth;
      proxy_pass http://api; include /etc/nginx/cip_proxy.conf;
      proxy_cache data; proxy_cache_key $request_uri; proxy_cache_valid 200 60s; proxy_cache_lock on;
      proxy_cache_use_stale updating error timeout http_502 http_503; proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
      proxy_hide_header Set-Cookie; include /etc/nginx/cip_headers.conf; add_header Cache-Control "private, no-cache";
    }
    location ~ ^/api/v1/(waves/\d+/(crosstab|results)|search|trend|trends/) {
      auth_request /_auth;
      proxy_pass http://api; include /etc/nginx/cip_proxy.conf;
      proxy_set_header Accept-Encoding gzip;   # cache the gzipped body once; gunzip for the rare client without gzip
      gunzip on;
      proxy_cache data;
      proxy_cache_key $request_uri;
      proxy_cache_valid 200 7d;                # emptied by every publish (CIP_NGINX_CACHE)
      open_file_cache off;                     # a publish's purge takes effect at once, not when a held file closes
      proxy_cache_lock on;                     # many people asking the same new thing: one request reaches the API
      proxy_cache_lock_timeout 10s;
      proxy_cache_use_stale updating error timeout http_502 http_503;
      proxy_cache_background_update on;
      proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;   # one copy for everyone: the answer is the same for every signed-in user, and the cookie was already checked
      proxy_hide_header Set-Cookie;
      include /etc/nginx/cip_headers.conf; add_header Cache-Control "private, no-cache"; add_header X-Cache $upstream_cache_status;
    }

    # no per-IP connection limit (a client office behind one NAT address would hit it); a high per-IP request rate
    # limit stops a runaway script, and the API's own admission control (CIP_BUILD_SLOTS) protects the core
    location /api/ { limit_req zone=perip burst=600 nodelay; proxy_pass http://api; include /etc/nginx/cip_proxy.conf; }
    location /auth/ { proxy_pass http://api; include /etc/nginx/cip_proxy.conf; }
    location = /healthz { proxy_pass http://api; include /etc/nginx/cip_proxy.conf; }
    location @api { proxy_pass http://api; include /etc/nginx/cip_proxy.conf; }

    location /assets/ { root /srv/cip/web; expires 1y; include /etc/nginx/cip_headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { root /srv/cip/web; try_files $uri /index.html; include /etc/nginx/cip_headers.conf; add_header Cache-Control "no-cache"; }

    error_page 502 504 = @busy;           # API restarting or overloaded: the screen shows "busy, retry"
    location @busy { default_type application/json; add_header Retry-After 3 always; return 503 '{"detail":"Busy: please retry in a few seconds"}'; }
  }
}
