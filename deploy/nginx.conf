# nginx in front of the CIP API on one 1-core server (deploy/compose.yml).
#  - the web app's files and the ETL-published payloads (etl/publish.py) come straight from disk, pre-gzipped:
#    no Python and no database on those requests, so the standard screens stay fast whatever the load
#  - every data file still needs a signed-in session, checked here by deploy/cip_auth.js (the API's own HMAC rule):
#    no request reaches Python just to prove who is asking. A session that sees everything (scope "*") gets the shared
#    file or cached answer; a filtered one (a client, a smaller tier: app/core/access.py) is handed to the API, which
#    filters (cip_auth.js answers 403, and error_page 403 = @api)
#  - TLS: on a VM, IT's certificate in ${CIP_TLS_DIR} (cert.pem, key.pem) on 8443 (deploy/cip_tls.conf); on Azure App
#    Service the platform ends TLS. 8080 sends browsers to https unless a TLS proxy in front already did TLS
#    (X-Forwarded-Proto: https)
#  - ad hoc answers that are the same for every user (cross-tabs, trends, search, results) are cached here until the
#    next publish (etl/publish.py empties CIP_NGINX_CACHE when it swaps in new data, then asks for the newest waves'
#    cross-tabs so they are ready before anyone opens them): the API computes each distinct
#    answer once a week however many people ask (22 Oct 2026 benchmark: .planning/wiki/STRESS_BENCHMARK.md)
#  - the team's own data (boards, alerts, views, audiences) and anything else goes to the API, never cached
load_module modules/ngx_http_js_module.so;
env CIP_SESSION_SECRET;                   # the cookie's signing key, shared with the API (cip_auth.js)
env CIP_REVOKED_FILE;                     # revoked sessions, written by the API (api/signin.share_revoked)
worker_processes 1;                       # one core
events { worker_connections 65536; multi_accept on; }   # 20,000 people with a connection open each, and room
worker_rlimit_nofile 131072;

http {
  include       /etc/nginx/mime.types;
  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 30s; keepalive_requests 10000;
  server_tokens off;
  # request logging: to files for the admins' Logs page in the App Service image (deploy/cip_logs.conf), off on the VM
  # (deploy/cip_logs_off.conf; "off" cancels every access_log at its level, so the two never share one)
  include /etc/nginx/logs.d/*.conf;
  gzip_static on;                         # send foo.json.gz when the browser accepts gzip
  gzip on; gzip_comp_level 5; gzip_types application/json text/css application/javascript image/svg+xml;
  open_file_cache max=20000 inactive=60s; open_file_cache_valid 30s;

  proxy_cache_path /var/cache/nginx/data levels=1:2 keys_zone=data:16m max_size=512m inactive=7d use_temp_path=off;

  # max_conns: at most 1,024 requests inside Python at once (≈85 KB each while they wait: ≈90 MB); past that nginx
  # answers 503 "busy, retry" itself, which the web app retries. Unbounded, a burst of 10,000 new cross-tabs queued
  # inside uvicorn and the API was OOM-killed at 768 MB; at 64 a burst of 1,000 got 93 % busy answers
  # (5 Nov 2026, scripts/ui_benchmark/burst.py)
  upstream api { server api:8000 max_conns=1024; keepalive 64; }
  js_import cip_auth from /etc/nginx/cip_auth.js;
  js_shared_dict_zone zone=sessions:8m timeout=60s evict;   # each cookie's sign-in answer, 60 s (cip_auth.js)
  include /etc/nginx/cip_csp_map.conf;   # $page_script_hashes for the CSP (deploy/csp_map.mjs)

  # a runaway script, not an office: 300 requests/s per address is ~50 analysts at once behind one NAT, with room to spare
  limit_req_zone $binary_remote_addr zone=perip:5m rate=300r/s;
  limit_req_status 503;                   # the web app already waits and retries on 503

  # The visitor's own address, not the proxy's: Azure App Service's front end (or IT's TLS proxy) connects from a private
  # address and names the visitor in X-Forwarded-For. Without this every visitor shares one address, so the per-address
  # limit above would throttle the whole office as one. Only private peers are believed: nobody outside can set it.
  set_real_ip_from 10.0.0.0/8; set_real_ip_from 172.16.0.0/12; set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 169.254.0.0/16; set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For; real_ip_recursive on;

  map $http_x_forwarded_proto $proto { default $scheme; https https; }
  # plain http goes to https, except: the ETL's cache warm-up from inside (Host nginx in compose, 127.0.0.1 in the single
  # container, deploy/start.sh) and the platform's health probe, which calls /healthz over plain http
  map "$proto:$host:$uri" $to_https { default 1; ~^https: 0; ~^http:nginx: 0; ~^http:127\.0\.0\.1(:\d+)?: 0; ~:/healthz$ 0; }

  server {                                  # plain HTTP: behind IT's TLS proxy, or a browser to send to https
    listen 8080 backlog=65535;              # a burst of thousands of new connections waits instead of being reset
    root /srv/cip;
    if ($to_https) { return 301 https://$host$request_uri; }
    include /etc/nginx/cip_locations.conf;
  }

  # TLS on 8443 with IT's certificate (deploy/cip_tls.conf) on a VM. Azure App Service ends TLS in front of the
  # container, so that image has no file here and nginx serves plain 8080 only.
  include /etc/nginx/tls.d/*.conf;
}
