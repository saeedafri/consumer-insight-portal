# nginx in front of the CIP API on one 1-core server (deploy/compose.yml).
#  - the web app's files and the ETL-published payloads (etl/publish.py) come straight from disk, pre-gzipped:
#    no Python and no database on those requests, so the standard screens stay fast whatever the load
#  - every data file still needs a signed-in session: auth_request asks the API once per cookie per minute
#  - ad hoc requests (cross-tabs, trends, search) go to the API, which queues them or answers 503 "busy, retry"
worker_processes 1;                       # one core
events { worker_connections 16384; }
worker_rlimit_nofile 65536;

http {
  include       /etc/nginx/mime.types;
  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 30s; keepalive_requests 10000;
  server_tokens off;
  access_log off;                         # the API logs what it serves; static hits are not worth the CPU
  gzip_static on;                         # send foo.json.gz when the browser accepts gzip
  gzip on; gzip_comp_level 5; gzip_types application/json text/css application/javascript image/svg+xml;
  open_file_cache max=20000 inactive=60s; open_file_cache_valid 30s;

  proxy_cache_path /var/cache/nginx/auth levels=1 keys_zone=auth:2m max_size=20m inactive=2m;

  upstream api { server api:8000; keepalive 64; }

  server {
    listen 8080;
    root /srv/cip;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /_auth {                   # cached sign-in check: one API call per session cookie per minute
      internal;
      proxy_pass http://api/auth/check;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Cookie $http_cookie;
      proxy_cache auth;
      proxy_cache_key $cookie_cip_session;
      proxy_cache_valid 204 60s;
      proxy_cache_valid 401 0;
    }

    # published payloads: the same URLs as the API, the same bytes (app/data/payloads.py), stored gzipped only
    location = /api/v1/waves {
      auth_request /_auth;
      types { } default_type application/json; add_header Cache-Control "private, no-cache"; add_header Content-Encoding gzip;
      try_files /published/current/api/v1/waves.json.gz @api;
    }
    location ~ ^/api/v1/waves/(\d+)/book$ {
      auth_request /_auth;
      types { } default_type application/json; add_header Cache-Control "private, no-cache"; add_header Content-Encoding gzip;
      try_files /published/current/api/v1/waves/$1/book.json.gz @api;
    }
    location ~ ^/api/v1/dashboards/(\w+)/(\d+)$ {
      auth_request /_auth;
      types { } default_type application/json; add_header Cache-Control "private, no-cache"; add_header Content-Encoding gzip;
      try_files /published/current/api/v1/dashboards/$1/$2.json.gz @api;
    }

    location ~ ^/api/v1/trends/([^/]+)/([^/]+)/([^/]+)/([^/]+)/([^/]+)$ {
      auth_request /_auth;
      types { } default_type application/json; add_header Cache-Control "private, no-cache"; add_header Content-Encoding gzip;
      try_files /published/current/api/v1/trends/$1/$2/$3/$4/$5.json.gz @api;
    }

    # no per-IP connection limit: a client office behind one NAT address would hit it; the API's own
    # admission control (CIP_BUILD_SLOTS) protects the core instead
    location /api/ { proxy_pass http://api; include /etc/nginx/cip_proxy.conf; }
    location /auth/ { proxy_pass http://api; include /etc/nginx/cip_proxy.conf; }
    location = /healthz { proxy_pass http://api; include /etc/nginx/cip_proxy.conf; }
    location @api { proxy_pass http://api; include /etc/nginx/cip_proxy.conf; }

    location /assets/ { root /srv/cip/web; expires 1y; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { root /srv/cip/web; try_files $uri /index.html; add_header Cache-Control "no-cache"; }

    error_page 502 504 = @busy;           # API restarting or overloaded: the screen shows "busy, retry"
    location @busy { default_type application/json; add_header Retry-After 3 always; return 503 '{"detail":"Busy: please retry in a few seconds"}'; }
  }
}
