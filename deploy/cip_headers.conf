# Security headers, the same as the API's own (api/main.security_headers). nginx drops the server-level add_header lines
# in any location that sets its own, so every such location includes this file. The script hash is index.html's inline
# theme script, filled in when the image is built (deploy/Dockerfile).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # ignored by browsers on plain http
