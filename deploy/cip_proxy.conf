# shared proxy settings for requests nginx passes to the API
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $proto;   # the API marks the cookie Secure and sends HSTS on https (api/signin.https)
proxy_connect_timeout 2s;
proxy_read_timeout 30s;
client_max_body_size 1m;   # config/access.yml max_body_kb; the API refuses bigger bodies too
# nginx adds the security headers itself (cip_headers.conf): drop the API's copies so each header is sent once
proxy_hide_header Content-Security-Policy; proxy_hide_header X-Frame-Options; proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy; proxy_hide_header Strict-Transport-Security;
