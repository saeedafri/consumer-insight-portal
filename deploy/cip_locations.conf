# Every location of the portal, included by the server in deploy/nginx.conf (port 8080).
include /etc/nginx/cip_headers.conf;   # the portal is not embedded elsewhere (X-Frame-Options)

location = /_auth {                   # the signed cookie, checked in nginx: microseconds, no API call
  internal;
  js_content cip_auth.check;
}

# published payloads: the same URLs as the API, the same bytes (shared/data/payloads.py), stored gzipped only
location = /api/v1/waves {
  auth_request /_auth; error_page 403 = @api; error_page 502 504 = @busy;   # 403: a filtered session, answered by the API; error_page here drops the server-level one
  types { } default_type application/json; include /etc/nginx/cip_headers.conf; add_header Cache-Control "private, no-cache"; add_header Content-Encoding gzip; gzip off;   # already gzipped: never twice
  try_files /published/current/api/v1/waves.json.gz @api;
}
location ~ ^/api/v1/waves/(\d+)/book$ {
  auth_request /_auth; error_page 403 = @api; error_page 502 504 = @busy;   # 403: a filtered session, answered by the API; error_page here drops the server-level one
  types { } default_type application/json; include /etc/nginx/cip_headers.conf; add_header Cache-Control "private, no-cache"; add_header Content-Encoding gzip; gzip off;   # already gzipped: never twice
  try_files /published/current/api/v1/waves/$1/book.json.gz @api;
}
location ~ ^/api/v1/dashboards/(\w+)/(\d+)$ {
  auth_request /_auth; error_page 403 = @api; error_page 502 504 = @busy;   # 403: a filtered session, answered by the API; error_page here drops the server-level one
  types { } default_type application/json; include /etc/nginx/cip_headers.conf; add_header Cache-Control "private, no-cache"; add_header Content-Encoding gzip; gzip off;   # already gzipped: never twice
  try_files /published/current/api/v1/dashboards/$1/$2.json.gz @api;
}

location ~ ^/api/v1/questions/([^/]+)/([^/]+)/([^/]+)$ {
  auth_request /_auth; error_page 403 = @api; error_page 502 504 = @busy;   # 403: a filtered session, answered by the API; error_page here drops the server-level one
  types { } default_type application/json; include /etc/nginx/cip_headers.conf; add_header Cache-Control "private, no-cache"; add_header Content-Encoding gzip; gzip off;   # already gzipped: never twice
  try_files /published/current/api/v1/questions/$1/$2/$3.json.gz @api;
}

# answers that are the same for every signed-in user: computed once per 30 s, then served by nginx
location = /api/v1/schedule {         # the launch schedule changes during fieldwork: one minute at most
  auth_request /_auth; error_page 403 = @api; error_page 502 504 = @busy;   # 403: a filtered session, answered by the API; error_page here drops the server-level one
  proxy_pass http://api; include /etc/nginx/cip_proxy.conf;
  proxy_cache data; proxy_cache_key $request_uri; proxy_cache_valid 200 60s; proxy_cache_lock on;
  proxy_cache_use_stale updating error timeout http_502 http_503; proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
  proxy_hide_header Set-Cookie; include /etc/nginx/cip_headers.conf; add_header Cache-Control "private, no-cache";
}
location ~ ^/api/v1/(waves/\d+/(crosstab|results)|search) {
  auth_request /_auth; error_page 403 = @api; error_page 502 504 = @busy;   # 403: a filtered session, answered by the API; error_page here drops the server-level one
  proxy_pass http://api; include /etc/nginx/cip_proxy.conf;
  proxy_set_header Accept-Encoding gzip;   # cache the gzipped body once; gunzip for the rare client without gzip
  gunzip on;
  proxy_cache data;
  # the published version is in the key ($realpath_root: the build "current" points to), so a publish starts new
  # keys at once: nothing is purged, nginx drops the old keys itself (unused 7 days, or past 512 MB). That lets
  # cache hits use open_file_cache, which halved them when off (5 Nov 2026: 4,300 → 8,700 answers/s)
  root /srv/cip/published/current;
  proxy_cache_key $realpath_root$request_uri;
  open_file_cache_valid 1s;                # $realpath_root sees a publish within a second (etl/publish.warm_nginx waits)
  proxy_cache_valid 200 7d;
  proxy_cache_lock on;                     # many people asking the same new thing: one request reaches the API
  proxy_cache_lock_timeout 10s;
  proxy_cache_use_stale updating error timeout http_502 http_503;
  proxy_cache_background_update on;
  proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;   # one copy for everyone: the answer is the same for every signed-in user, and the cookie was already checked
  proxy_hide_header Set-Cookie;
  include /etc/nginx/cip_headers.conf; add_header Cache-Control "private, no-cache"; add_header X-Cache $upstream_cache_status;
}

# no per-IP connection limit (a client office behind one NAT address would hit it); a high per-IP request rate
# limit stops a runaway script, and the API's own admission control (CIP_BUILD_SLOTS) protects the core
location /api/ { limit_req zone=perip burst=600 nodelay; proxy_pass http://api; include /etc/nginx/cip_proxy.conf; }
location /auth/ { proxy_pass http://api; include /etc/nginx/cip_proxy.conf; }
location = /healthz { proxy_pass http://api; include /etc/nginx/cip_proxy.conf; }
location @api { proxy_pass http://api; include /etc/nginx/cip_proxy.conf; }

# the Next.js static export (frontend/): public pages as HTML, the signed-in app as one page under /app/
location /_next/static/ { root /srv/cip/web; include /etc/nginx/cip_headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }
location /app/ { root /srv/cip/web; try_files $uri /app/index.html; include /etc/nginx/cip_headers.conf; add_header Cache-Control "no-cache"; }
location / { root /srv/cip/web; try_files $uri $uri/index.html =404; error_page 404 /404.html; include /etc/nginx/cip_headers.conf; add_header Cache-Control "no-cache"; }

error_page 502 504 = @busy;           # API restarting or overloaded: the screen shows "busy, retry"
location @busy { default_type application/json; add_header Retry-After 3 always; return 503 '{"detail":"Busy: please retry in a few seconds"}'; }

# the MCP connector (api/mcp.py): API-key requests straight to the API
location = /mcp { limit_req zone=perip burst=600 nodelay; proxy_pass http://api; include /etc/nginx/cip_proxy.conf; }
